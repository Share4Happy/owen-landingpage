<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Không tìm thấy trang | Owen Fashion</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    :root {
      --bg: #121212;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --btn-bg: #ffffff;
      --btn-text: #121212;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }
    h1 { font-size: 5rem; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; text-transform: uppercase; }
    p { color: var(--text-muted); max-width: 460px; margin-bottom: 2rem; line-height: 1.6; }
    a {
      display: inline-block;
      background: var(--btn-bg);
      color: var(--btn-text);
      padding: 0.85rem 2rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Trang không tồn tại</h2>
  <p>Địa chỉ bạn truy cập có thể đã thay đổi hoặc không còn khả dụng. Vui lòng quay về trang chủ để tiếp tục khám phá bộ sưu tập Owen.</p>
  <a href="./">Về trang chủ Owen</a>
</body>
</html>
